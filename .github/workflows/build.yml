name: Build
on:
  push:
    branches:
      - botcommands-v3
    paths:
      - 'gradle/**'
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

jobs:
  build:
    uses: srnyx/tools/.github/workflows/build.yml@main
    with:
      java: 26
      pterodactyl-server: e53418e2
    secrets:
      PTERODACTYL_TOKEN: ${{ secrets.PTERODACTYL_TOKEN }}
